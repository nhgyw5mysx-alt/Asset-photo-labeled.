<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1f33">
<title>Asset Photo Labeler</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#eef1f4;color:#14202b;
  }
  .app{max-width:760px;margin:auto;padding:20px 16px 40px}
  .top{
    background:#0b1f33;color:#fff;border-radius:16px;padding:20px;
    box-shadow:0 8px 24px rgba(0,0,0,.12);margin-bottom:16px
  }
  .top h1{margin:0;font-size:24px;letter-spacing:.2px}
  .top p{margin:6px 0 0;color:#cbd6df;font-size:14px}
  .card{
    background:#fff;border-radius:16px;padding:18px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);margin-bottom:16px
  }
  .choose{
    width:100%;border:0;border-radius:12px;background:#0b1f33;color:#fff;
    padding:15px;font-size:17px;font-weight:700;cursor:pointer
  }
  input[type=file]{display:block;width:100%;margin-top:10px}
  .preview{
    display:none;width:100%;max-height:360px;object-fit:contain;
    border-radius:10px;margin-top:14px;background:#111
  }
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field{margin-top:12px}
  .field.full{grid-column:1/-1}
  label{display:block;font-weight:700;font-size:13px;margin-bottom:6px;color:#344454}
  input[type=text]{
    width:100%;padding:12px;border:1px solid #cbd3da;border-radius:9px;
    font-size:16px;background:#fff
  }
  .create{
    width:100%;margin-top:16px;padding:15px;border:0;border-radius:12px;
    background:#1b5e8c;color:#fff;font-size:17px;font-weight:800;cursor:pointer
  }
  .create:disabled{background:#aeb8c1;cursor:not-allowed}
  .hint{font-size:12px;color:#667583;margin-top:8px}
  #result{display:none;width:100%;border-radius:10px;background:#111}
  .download{
    display:block;text-align:center;text-decoration:none;margin-top:12px;
    padding:13px;border-radius:10px;background:#0b1f33;color:#fff;font-weight:700
  }
  .status{font-size:13px;margin-top:10px;color:#52606d;min-height:18px}
  @media(max-width:560px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>Asset Photo Labeler</h1>
    <p>Create consistent, professional equipment identification photos.</p>
  </div>

  <div class="card">
    <button class="choose" id="chooseBtn" type="button">Choose Photo</button>
    <input id="photoInput" type="file" accept="image/*,.heic,.heif,.jpg,.jpeg,.png,.webp">
    <img id="preview" class="preview" alt="Selected photo">
    <div class="status" id="status"></div>
  </div>

  <div class="card">
    <div class="grid">
      <div class="field full">
        <label for="location">Location</label>
        <input id="location" type="text" placeholder="e.g. Building 3">
      </div>
      <div class="field">
        <label for="model">Model</label>
        <input id="model" type="text" placeholder="Model">
      </div>
      <div class="field">
        <label for="size">Size</label>
        <input id="size" type="text" placeholder='e.g. 2"'>
      </div>
      <div class="field">
        <label for="serial">Serial Number</label>
        <input id="serial" type="text" placeholder="Serial number">
      </div>
      <div class="field">
        <label for="engineering">Engineering Number</label>
        <input id="engineering" type="text" placeholder="Engineering number">
      </div>
    </div>
    <button class="create" id="create" type="button" disabled>Create Label</button>
    <div class="hint">Every generated image is fixed at 1600 × 1400 px.</div>
  </div>

  <div class="card" id="outputCard" style="display:none">
    <img id="result" alt="Generated asset label">
    <a id="download" class="download" download="asset-labelled.jpg">Download Label</a>
  </div>
</div>

<canvas id="canvas" width="1600" height="1400" style="display:none"></canvas>

<script>
const input = document.getElementById('photoInput');
const chooseBtn = document.getElementById('chooseBtn');
const preview = document.getElementById('preview');
const createBtn = document.getElementById('create');
const status = document.getElementById('status');
const canvas = document.getElementById('canvas');
const result = document.getElementById('result');
const download = document.getElementById('download');
const outputCard = document.getElementById('outputCard');

let image = new Image();
let selectedFile = null;

chooseBtn.addEventListener('click', () => input.click());

input.addEventListener('change', async () => {
  const file = input.files && input.files[0];
  if (!file) return;

  selectedFile = file;
  status.textContent = 'Loading photo…';
  createBtn.disabled = true;

  try {
    const url = URL.createObjectURL(file);
    image = new Image();
    image.onload = () => {
      preview.src = url;
      preview.style.display = 'block';
      createBtn.disabled = false;
      status.textContent = 'Photo ready.';
    };
    image.onerror = () => {
      status.textContent = 'This image could not be opened by Safari. Try JPG or PNG.';
      createBtn.disabled = true;
    };
    image.src = url;
  } catch (e) {
    status.textContent = 'Could not load the selected photo.';
  }
});

function roundedRect(ctx,x,y,w,h,r){
  const rr=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr,y);
  ctx.arcTo(x+w,y,x+w,y+h,rr);
  ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr);
  ctx.arcTo(x,y,x+w,y,rr);
  ctx.closePath();
}

function drawCover(ctx,img,x,y,w,h){
  const scale=Math.max(w/img.naturalWidth,h/img.naturalHeight);
  const sw=img.naturalWidth*scale;
  const sh=img.naturalHeight*scale;
  const dx=x+(w-sw)/2;
  const dy=y+(h-sh)/2;
  ctx.drawImage(img,dx,dy,sw,sh);
}

function drawContain(ctx,img,x,y,w,h){
  const scale=Math.min(w/img.naturalWidth,h/img.naturalHeight);
  const sw=img.naturalWidth*scale;
  const sh=img.naturalHeight*scale;
  const dx=x+(w-sw)/2;
  const dy=y+(h-sh)/2;
  ctx.drawImage(img,dx,dy,sw,sh);
}

async function ensureLogo(){
  if (window.cidLogo && cidLogo.complete && cidLogo.naturalWidth) return cidLogo;
  const logo = new Image();
  logo.src = 'cid-logo.jpeg';
  await new Promise((resolve,reject)=>{
    logo.onload=resolve;
    logo.onerror=reject;
  });
  window.cidLogo=logo;
  return logo;
}

createBtn.addEventListener('click', async () => {
  if (!image || !image.naturalWidth) return;

  createBtn.disabled = true;
  status.textContent = 'Generating label…';

  try {
    const ctx = canvas.getContext('2d');
    const W = 1600, H = 1400;
    const photoH = 900;
    const panelY = 920;
    const panelH = H - panelY;

    canvas.width=W; canvas.height=H;

    // Background
    ctx.fillStyle='#ffffff';
    ctx.fillRect(0,0,W,H);

    // Photo: fixed 1600 × 900 area, center-cropped with no stretching
    ctx.save();
    ctx.beginPath();
    ctx.rect(0,0,W,photoH);
    ctx.clip();
    drawCover(ctx,image,0,0,W,photoH);
    ctx.restore();

    // Photo bottom divider
    ctx.fillStyle='#0b1f33';
    ctx.fillRect(0,photoH,W,20);

    // Professional label panel
    ctx.fillStyle='#f7f9fb';
    ctx.fillRect(0,panelY,W,panelH);

    // Header
    ctx.fillStyle='#0b1f33';
    ctx.fillRect(0,panelY,W,120);

    // Logo
    const logo = await ensureLogo();
    const maxLogoW=300, maxLogoH=82;
    const scale=Math.min(maxLogoW/logo.naturalWidth,maxLogoH/logo.naturalHeight);
    const lw=logo.naturalWidth*scale, lh=logo.naturalHeight*scale;
    ctx.drawImage(logo,60,panelY+(120-lh)/2,lw,lh);

    ctx.fillStyle='#ffffff';
    ctx.font='800 34px Arial, sans-serif';
    ctx.textAlign='right';
    ctx.textBaseline='middle';
    ctx.fillText('ASSET IDENTIFICATION',1540,panelY+60);

    const fields=[
      ['LOCATION', document.getElementById('location').value.trim() || '—'],
      ['MODEL', document.getElementById('model').value.trim() || '—'],
      ['SERIAL NUMBER', document.getElementById('serial').value.trim() || '—'],
      ['ENGINEERING NUMBER', document.getElementById('engineering').value.trim() || '—'],
      ['SIZE', document.getElementById('size').value.trim() || '—']
    ];

    const x0=60, labelW=330, valueX=x0+labelW+25;
    const rowY=panelY+120, rowH=52;

    fields.forEach((f,i)=>{
      const y=rowY+i*rowH;

      if(i%2===0){
        ctx.fillStyle='#edf2f6';
        ctx.fillRect(40,y,W-80,rowH);
      }

      ctx.fillStyle='#506170';
      ctx.font='800 22px Arial, sans-serif';
      ctx.textAlign='left';
      ctx.textBaseline='middle';
      ctx.fillText(f[0],x0,y+rowH/2);

      ctx.fillStyle='#14202b';
      ctx.font=(f[0]==='SERIAL NUMBER' ? '800 27px Arial, sans-serif' : '600 25px Arial, sans-serif');
      ctx.fillText(f[1],valueX,y+rowH/2);

      ctx.strokeStyle='#d6dde3';
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(40,y+rowH);
      ctx.lineTo(W-40,y+rowH);
      ctx.stroke();
    });

    // Footer
    ctx.fillStyle='#0b1f33';
    ctx.fillRect(0,H-24,W,24);

    const dataUrl=canvas.toDataURL('image/jpeg',0.92);
    result.src=dataUrl;
    download.href=dataUrl;
    download.download='asset-labelled.jpg';
    outputCard.style.display='block';
    status.textContent='Label created — 1600 × 1400 px.';
    outputCard.scrollIntoView({behavior:'smooth',block:'start'});
  } catch(err) {
    console.error(err);
    status.textContent='Could not create the label. Check that cid-logo.jpeg is in the same GitHub folder.';
  } finally {
    createBtn.disabled=false;
  }
});
</script>
</body>
</html>
