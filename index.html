<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a2b">
<title>CID Asset Photo Labeler</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}body{margin:0;background:#edf1f4;color:#102131;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.app{max-width:760px;margin:auto;padding:18px 15px 42px}.top{background:#071a2b;color:#fff;padding:22px;border-radius:18px;box-shadow:0 8px 25px #0002}
h1{margin:0;font-size:26px;letter-spacing:.2px}.top p{margin:6px 0 0;color:#cbd7e1;font-size:14px}
.card{background:#fff;border-radius:18px;padding:18px;margin-top:15px;box-shadow:0 5px 18px #00000012}
.choose,.create,.download{width:100%;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:800}
.choose,.create{background:#0b2941;color:#fff}.create{margin-top:15px;background:#145d8a}.create:disabled{background:#aab5be}
input[type=file]{width:100%;margin-top:10px}.preview{display:none;width:100%;max-height:360px;object-fit:contain;margin-top:14px;border-radius:10px;background:#111}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}.field{margin-top:4px}
label{display:block;font-size:13px;font-weight:800;color:#445665;margin-bottom:6px}
input[type=text]{width:100%;padding:13px;border:1px solid #cbd4db;border-radius:10px;font-size:17px}
.hint,.status{font-size:12px;color:#637381;margin-top:9px;min-height:17px}#outputCard{display:none}#result{width:100%;display:block;border-radius:12px}
.download{display:block;text-align:center;text-decoration:none;background:#071a2b;color:#fff;margin-top:12px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
<div class="top"><h1>CID Asset Photo Labeler</h1><p>Professional equipment identification & asset register photos</p></div>

<div class="card">
<button class="choose" id="choose" type="button">Choose Photo</button>
<input id="file" type="file" accept="image/*,.heic,.heif,.jpg,.jpeg,.png,.webp">
<img id="preview" class="preview" alt="Selected photo">
<div id="status" class="status"></div>
</div>

<div class="card">
<div class="grid">
<div class="field full"><label>LOCATION</label><input id="location" type="text" placeholder="e.g. Building 3"></div>
<div class="field"><label>MODEL</label><input id="model" type="text"></div>
<div class="field"><label>SIZE</label><input id="size" type="text" placeholder='e.g. 2"'></div>
<div class="field"><label>SERIAL NUMBER</label><input id="serial" type="text"></div>
<div class="field"><label>ENGINEERING NUMBER</label><input id="engineering" type="text"></div>
</div>
<button id="create" class="create" disabled>CREATE LABEL</button>
<div class="hint">Final image: 1600 × 1400 px</div>
</div>

<div class="card" id="outputCard"><img id="result"><a id="download" class="download" download="CID-asset.jpg">DOWNLOAD LABEL</a></div>
<canvas id="canvas" width="1600" height="1400" style="display:none"></canvas>
</div>

<script>
const $=id=>document.getElementById(id);
let img=null, fileUrl=null;
$("choose").onclick=()=> $("file").click();

$("file").onchange=()=>{
 const f=$("file").files[0]; if(!f)return;
 $("status").textContent="Loading photo…"; $("create").disabled=true;
 fileUrl=URL.createObjectURL(f); img=new Image();
 img.onload=()=>{ $("preview").src=fileUrl; $("preview").style.display="block"; $("create").disabled=false; $("status").textContent="Photo ready."; };
 img.onerror=()=> $("status").textContent="Could not open this photo. Try JPG or PNG.";
 img.src=fileUrl;
};

function cover(c,i,w,h){
 const s=Math.max(w/i.naturalWidth,h/i.naturalHeight);
 const nw=i.naturalWidth*s,nh=i.naturalHeight*s;
 c.drawImage(i,(w-nw)/2,(h-nh)/2,nw,nh);
}
function rr(c,x,y,w,h,r){
 c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);
 c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
}
async function getLogo(){
 if(window.logo?.complete&&logo.naturalWidth)return logo;
 const l=new Image();l.src="cid-logo.jpeg";
 await new Promise((ok,no)=>{l.onload=ok;l.onerror=no});window.logo=l;return l;
}

$("create").onclick=async()=>{
 if(!img?.naturalWidth)return;
 $("create").disabled=true;$("status").textContent="Creating professional label…";
 try{
  const c=$("canvas"),x=c.getContext("2d"),W=1600,H=1400,photoH=900,panel=930;
  c.width=W;c.height=H;
  x.fillStyle="#fff";x.fillRect(0,0,W,H);

  // PHOTO
  x.save();x.beginPath();x.rect(35,35,W-70,photoH-35);x.clip();cover(x,img,W-70,photoH-35);x.restore();
  x.fillStyle="#071a2b";x.fillRect(0,895,W,35);

  // PANEL
  x.fillStyle="#071a2b";x.fillRect(0,panel,W,175);
  const logo=await getLogo();
  const maxW=360,maxH=105,s=Math.min(maxW/logo.naturalWidth,maxH/logo.naturalHeight);
  x.drawImage(logo,55,panel+(175-logo.naturalHeight*s)/2,logo.naturalWidth*s,logo.naturalHeight*s);

  x.fillStyle="#fff";x.textAlign="right";x.textBaseline="alphabetic";
  x.font="800 36px Arial,sans-serif";x.fillText("ASSET IDENTIFICATION",1545,995);
  x.font="500 22px Arial,sans-serif";x.fillStyle="#bfcbd5";x.fillText("EQUIPMENT / ASSET REGISTER",1545,1033);

  const rows=[
   ["LOCATION",$("location").value.trim()||"—"],
   ["MODEL",$("model").value.trim()||"—"],
   ["SERIAL NUMBER",$("serial").value.trim()||"—"],
   ["ENGINEERING NUMBER",$("engineering").value.trim()||"—"],
   ["SIZE",$("size").value.trim()||"—"]
  ];
  const y0=1080,rh=55;
  rows.forEach((r,i)=>{
   const y=y0+i*rh;
   x.fillStyle=i%2?"#f4f6f8":"#e9eef2";x.fillRect(45,y,W-90,rh-3);
   x.fillStyle="#526574";x.textAlign="left";x.textBaseline="middle";x.font="800 20px Arial,sans-serif";x.fillText(r[0],75,y+26);
   x.fillStyle="#102131";x.font=r[0]=="SERIAL NUMBER"?"800 28px Arial,sans-serif":"650 25px Arial,sans-serif";x.fillText(r[1],440,y+26);
  });

  x.fillStyle="#145d8a";x.fillRect(0,1370,W,30);
  const data=c.toDataURL("image/jpeg",.93);$("result").src=data;$("download").href=data;
  $("outputCard").style.display="block";$("status").textContent="Label created — 1600 × 1400 px.";
  $("outputCard").scrollIntoView({behavior:"smooth"});
 }catch(e){console.error(e);$("status").textContent="Could not create label. Make sure cid-logo.jpeg is in GitHub."}
 $("create").disabled=false;
};
</script>
</body>
</html>
