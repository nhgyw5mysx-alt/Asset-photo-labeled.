<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a2b">
<title>CID Asset Photo Labeler</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}body{margin:0;background:#edf1f4;color:#102131;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.app{max-width:760px;margin:auto;padding:18px 15px 42px}.top{background:#071a2b;color:#fff;padding:22px;border-radius:18px;box-shadow:0 8px 25px #0002}
h1{margin:0;font-size:26px;letter-spacing:.2px}.top p{margin:6px 0 0;color:#cbd7e1;font-size:14px}
.card{background:#fff;border-radius:18px;padding:18px;margin-top:15px;box-shadow:0 5px 18px #00000012}
.choose,.create,.download{width:100%;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:800}
.choose,.create{background:#0b2941;color:#fff}.create{margin-top:15px;background:#145d8a}.create:disabled{background:#aab5be}
input[type=file]{width:100%;margin-top:10px}.preview{display:none;width:100%;max-height:360px;object-fit:contain;margin-top:14px;border-radius:10px;background:#111}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}.field{margin-top:4px}
label{display:block;font-size:13px;font-weight:800;color:#445665;margin-bottom:6px}
input[type=text]{width:100%;padding:13px;border:1px solid #cbd4db;border-radius:10px;font-size:17px}
.hint,.status{font-size:12px;color:#637381;margin-top:9px;min-height:17px}#outputCard{display:none}#result{width:100%;display:block;border-radius:12px}
.download{display:block;text-align:center;text-decoration:none;background:#071a2b;color:#fff;margin-top:12px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}

.selector{margin-bottom:17px}.selector label{font-size:14px}
.duration{background:#e9f1f6;border:1px solid #c8d8e3;border-radius:10px;padding:12px;font-size:16px;font-weight:800;color:#0b466b}
</style>
</head>
<body>
<div class="app">
<div class="top"><h1>CID Asset Photo Labeler</h1><p>Professional equipment identification & asset register photos</p></div>

<div class="card">
<div class="selector">
<label for="labelType">LABEL TYPE</label>
<select id="labelType">
<option value="asset">Asset Identification</option>
<option value="passivation">Passivation</option>
</select>
</div>

<button class="choose" id="choose" type="button">Choose Photo</button>
<input id="file" type="file" accept="image/*,.heic,.heif,.jpg,.jpeg,.png,.webp">
<img id="preview" class="preview" alt="Selected photo">
<div id="status" class="status"></div>
</div>

<div class="card">
<div id="assetFields">
<div class="grid">
<div class="field full"><label>LOCATION</label><input id="location" type="text" placeholder="e.g. Building 3"></div>
<div class="field"><label>MODEL</label><input id="model" type="text"></div>
<div class="field"><label>SIZE</label><input id="size" type="text" placeholder='e.g. 2"'></div>
<div class="field"><label>SERIAL NUMBER</label><input id="serial" type="text"></div>
<div class="field"><label>ENGINEERING NUMBER</label><input id="engineering" type="text"></div>
</div>
<div id="passivationFields" style="display:none">
<div class="grid">
<div class="field full"><label>SYSTEM</label><input id="system" type="text" placeholder="System"></div>
<div class="field"><label>LOCATION</label><input id="pLocation" type="text" placeholder="Location"></div>
<div class="field"><label>DATE</label><input id="pDate" type="date"></div>
<div class="field"><label>START TIME</label><input id="startTime" type="time"></div>
<div class="field"><label>FINISH TIME</label><input id="finishTime" type="time"></div>
<div class="field full"><div class="duration" id="duration">PASSIVATION DURATION: —</div></div>
<div class="field"><label>CHEMICAL</label><input id="chemical" type="text" placeholder="Chemical"></div>
<div class="field"><label>AMOUNT OF CHEMICAL</label><input id="amount" type="text" placeholder="e.g. 18.9 L"></div>
<div class="field"><label>FINAL CONDUCTIVITY</label><input id="conductivity" type="number" inputmode="decimal" step="any" min="0" placeholder="e.g. 12.5"></div>
<div class="field"><label>CONDUCTED BY</label><input id="conductedBy" type="text" placeholder="Name"></div>
</div>
</div>

</div>
<button id="create" class="create" disabled>CREATE LABEL</button>
<div class="hint">Final image: 1600 × 1400 px</div>
</div>

<div class="card" id="outputCard"><img id="result"><a id="download" class="download" download="CID-asset.jpg">DOWNLOAD LABEL</a></div>
<canvas id="canvas" width="1600" height="1400" style="display:none"></canvas>
</div>

<script>
const $=id=>document.getElementById(id);
let img=null, fileUrl=null;
$("choose").onclick=()=> $("file").click();

$("file").onchange=()=>{
 const f=$("file").files[0]; if(!f)return;
 $("status").textContent="Loading photo…"; $("create").disabled=true;
 fileUrl=URL.createObjectURL(f); img=new Image();
 img.onload=()=>{ $("preview").src=fileUrl; $("preview").style.display="block"; $("create").disabled=false; $("status").textContent="Photo ready."; };
 img.onerror=()=> $("status").textContent="Could not open this photo. Try JPG or PNG.";
 img.src=fileUrl;
};

function cover(c,i,w,h){
 const s=Math.max(w/i.naturalWidth,h/i.naturalHeight);
 const nw=i.naturalWidth*s,nh=i.naturalHeight*s;
 c.drawImage(i,(w-nw)/2,(h-nh)/2,nw,nh);
}
function rr(c,x,y,w,h,r){
 c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);
 c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
}
async function getLogo(){
 if(window.logo?.complete&&logo.naturalWidth)return logo;
 const l=new Image();l.src="cid-logo-transparent.png";
 await new Promise((ok,no)=>{l.onload=ok;l.onerror=no});window.logo=l;return l;
}

$("labelType").onchange=()=>{
 const p=$("labelType").value==="passivation";
 $("assetFields").style.display=p?"none":"block";
 $("passivationFields").style.display=p?"block":"none";
 $("create").textContent=p?"CREATE PASSIVATION LABEL":"CREATE ASSET LABEL";
 $("outputCard").style.display="none";
};

function durationText(){
 const a=$("startTime").value,b=$("finishTime").value;
 if(!a||!b)return "—";
 let [ah,am]=a.split(":").map(Number),[bh,bm]=b.split(":").map(Number);
 let s=ah*60+am,e=bh*60+bm;if(e<s)e+=1440;
 let m=e-s,h=Math.floor(m/60),min=m%60;
 return `${h} hr${h===1?"":"s"} ${min} min`;
}
$("startTime").oninput=$("finishTime").oninput=()=>{$("duration").textContent="PASSIVATION DURATION: "+durationText()};

$("create").onclick=async()=>{
 if(!img?.naturalWidth)return;
 $("create").disabled=true;$("status").textContent="Creating label…";
 try{
  const c=$("canvas"),x=c.getContext("2d"),W=1600,H=1400,photoH=900,panel=920;
  c.width=W;c.height=H;
  x.fillStyle="#fff";x.fillRect(0,0,W,H);

  // Fixed photo window: 1600 x 900, cropped without distortion.
  x.save();x.beginPath();x.rect(0,0,W,photoH);x.clip();cover(x,img,0,0,W,photoH);x.restore();
  x.fillStyle="#071a2b";x.fillRect(0,900,W,20);

  // Branded information panel.
  x.fillStyle="#071a2b";x.fillRect(0,panel,W,450);

  const logo=await getLogo();
  const maxW=285,maxH=100,s=Math.min(maxW/logo.naturalWidth,maxH/logo.naturalHeight);
  const lw=logo.naturalWidth*s,lh=logo.naturalHeight*s;
  x.drawImage(logo,55,panel+25,lw,lh);

  const pass=$("labelType").value==="passivation";
  x.fillStyle="#fff";x.textAlign="right";x.textBaseline="alphabetic";
  x.font="800 38px Arial,sans-serif";
  x.fillText(pass?"PASSIVATION RECORD":"ASSET IDENTIFICATION",1545,panel+65);
  x.font="500 21px Arial,sans-serif";x.fillStyle="#bfcbd5";
  x.fillText(pass?"PROCESS RECORD / SITE DOCUMENTATION":"EQUIPMENT / ASSET REGISTER",1545,panel+101);

  const rows=pass?[
   ["SYSTEM",$("system").value.trim()||"—"],
   ["LOCATION",$("pLocation").value.trim()||"—"],
   ["DATE",$("pDate").value||"—"],
   ["START TIME",$("startTime").value||"—"],
   ["FINISH TIME",$("finishTime").value||"—"],
   ["DURATION",durationText()],
   ["CHEMICAL",$("chemical").value.trim()||"—"],
   ["AMOUNT OF CHEMICAL",$("amount").value.trim()||"—"],
   ["FINAL CONDUCTIVITY",($("conductivity").value.trim()||"—")+" µS/cm"],
   ["CONDUCTED BY",$("conductedBy").value.trim()||"—"]
  ]:[
   ["LOCATION",$("location").value.trim()||"—"],
   ["MODEL",$("model").value.trim()||"—"],
   ["SERIAL NUMBER",$("serial").value.trim()||"—"],
   ["ENGINEERING NUMBER",$("engineering").value.trim()||"—"],
   ["SIZE",$("size").value.trim()||"—"]
  ];

  // Information panel is intentionally larger for Passivation.
  const rowH=pass?31:58;
  const startY=pass?1030:1050;
  const labelW=360;
  rows.forEach((r,i)=>{
    const y=startY+i*rowH;
    x.fillStyle=i%2===0?"#e9eef2":"#f4f6f8";
    x.fillRect(45,y,W-90,rowH-3);
    x.fillStyle="#526574";x.textAlign="left";x.textBaseline="middle";
    x.font=pass?"800 16px Arial,sans-serif":"800 20px Arial,sans-serif";
    x.fillText(r[0],70,y+(rowH-3)/2);
    x.fillStyle="#102131";
    x.font=(r[0]==="SERIAL NUMBER"&&!pass)?"800 27px Arial,sans-serif":(pass?"650 17px Arial,sans-serif":"650 25px Arial,sans-serif");
    x.fillText(r[1],70+labelW,y+(rowH-3)/2);
  });

  x.fillStyle="#145d8a";x.fillRect(0,1370,W,30);
  const data=c.toDataURL("image/jpeg",.93);
  $("result").src=data;$("download").href=data;
  $("outputCard").style.display="block";
  $("status").textContent=(pass?"Passivation":"Asset")+" label created — 1600 × 1400 px.";
  $("outputCard").scrollIntoView({behavior:"smooth"});
 }catch(e){
  console.error(e);
  $("status").textContent="Could not create label. Make sure cid-logo-transparent.png is in GitHub.";
 }finally{$("create").disabled=false}
};
if($("labelType")) $("labelType").onchange();
</script>
</body>
</html>
