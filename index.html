<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a2b"><title>CID Asset Photo Labeler</title><link rel="manifest" href="manifest.webmanifest"><style>*{box-sizing:border-box}body{margin:0;background:#edf1f4;color:#102131;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{max-width:760px;margin:auto;padding:18px 15px 42px}.top{background:#071a2b;color:white;padding:22px;border-radius:18px}.top h1{margin:0;font-size:26px}.top p{margin:6px 0 0;color:#cbd7e1}.card{background:white;border-radius:18px;padding:18px;margin-top:15px;box-shadow:0 5px 18px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:800;color:#445665;margin-bottom:6px}input,select{width:100%;padding:13px;border:1px solid #cbd4db;border-radius:10px;font-size:17px;background:white}.choose,.create,.download{width:100%;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:800}.choose,.create{background:#0b2941;color:white}.create{margin-top:15px;background:#145d8a}.create:disabled{background:#aab5be}#file{margin-top:10px}.preview{display:none;width:100%;max-height:360px;object-fit:contain;margin-top:14px;border-radius:10px;background:#111}.status,.hint{font-size:12px;color:#637381;margin-top:9px;min-height:17px}.duration{background:#e9f1f6;border:1px solid #c8d8e3;border-radius:10px;padding:12px;font-size:16px;font-weight:800;color:#0b466b}.download{display:block;text-align:center;text-decoration:none;background:#071a2b;color:white;margin-top:12px}#outputCard{display:none}#result{width:100%;display:block;border-radius:12px}@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="app"><div class="top"><h1>CID Asset Photo Labeler</h1><p>Professional equipment identification & passivation records</p></div><div class="card"><label>LABEL TYPE</label><select id="type"><option value="asset">Asset Identification</option><option value="pass">Passivation</option></select><br><br><button class="choose" id="choose">Choose Photo</button><input id="file" type="file" accept="image/*,.heic,.heif,.jpg,.jpeg,.png,.webp"><img id="preview" class="preview"><div id="status" class="status"></div></div><div class="card"><div id="asset"><div class="grid"><div class="full"><label>LOCATION</label><input id="location"></div><div><label>MODEL</label><input id="model"></div><div><label>SIZE</label><input id="size" placeholder='e.g. 2"'></div><div><label>SERIAL NUMBER</label><input id="serial"></div><div><label>ENGINEERING NUMBER</label><input id="engineering"></div></div></div><div id="pass" style="display:none"><div class="grid"><div class="full"><label>SYSTEM</label><input id="system"></div><div><label>LOCATION</label><input id="plocation"></div><div><label>DATE</label><input id="date" type="date"></div><div><label>START TIME</label><input id="start" type="time"></div><div><label>FINISH TIME</label><input id="finish" type="time"></div><div class="full"><div id="duration" class="duration">PASSIVATION DURATION: —</div></div><div><label>CHEMICAL</label><input id="chemical"></div><div><label>AMOUNT OF CHEMICAL</label><input id="amount" placeholder="e.g. 18.9 L"></div><div class="full"><label>FINAL CONDUCTIVITY</label><input id="conductivity" type="number" step="any" inputmode="decimal" placeholder="e.g. 12.5"></div></div></div><button id="create" class="create" disabled>CREATE LABEL</button><div class="hint">Every generated image is 1600 × 1400 px.</div></div><div class="card" id="outputCard"><img id="result"><a id="download" class="download" download="CID-label.jpg">DOWNLOAD LABEL</a></div><canvas id="canvas" width="1600" height="1400" style="display:none"></canvas></div><script>const $=x=>document.getElementById(x);let img=null,url=null;$('choose').onclick=()=>$('file').click();$('file').onchange=()=>{let f=$('file').files[0];if(!f)return;url=URL.createObjectURL(f);img=new Image();$('status').textContent='Loading photo…';img.onload=()=>{$('preview').src=url;$('preview').style.display='block';$('create').disabled=false;$('status').textContent='Photo ready.'};img.onerror=()=>$('status').textContent='Could not open this photo. Try JPG or PNG.';img.src=url};$('type').onchange=()=>{let p=$('type').value==='pass';$('asset').style.display=p?'none':'block';$('pass').style.display=p?'block':'none';$('create').textContent=p?'CREATE PASSIVATION LABEL':'CREATE ASSET LABEL';$('outputCard').style.display='none'};function dur(){let a=$('start').value,b=$('finish').value;if(!a||!b)return 'PASSIVATION DURATION: —';let [ah,am]=a.split(':').map(Number),[bh,bm]=b.split(':').map(Number),s=ah*60+am,e=bh*60+bm;if(e<s)e+=1440;let m=e-s;return `PASSIVATION DURATION: ${Math.floor(m/60)} hr ${m%60} min`}$('start').oninput=$('finish').oninput=()=>$('duration').textContent=dur();function cover(c,i,x,y,w,h){let s=Math.max(w/i.naturalWidth,h/i.naturalHeight),nw=i.naturalWidth*s,nh=i.naturalHeight*s;c.drawImage(i,x+(w-nw)/2,y+(h-nh)/2,nw,nh)}async function logo(){if(window.l?.naturalWidth)return l;let q=new Image();q.src='cid-logo.jpeg';await new Promise((a,b)=>{q.onload=a;q.onerror=b});window.l=q;return q}function rows(c,r,y){r.forEach((v,i)=>{let yy=y+i*55;c.fillStyle=i%2?'#f4f6f8':'#e9eef2';c.fillRect(45,yy,1510,52);c.fillStyle='#526574';c.font='800 20px Arial';c.textAlign='left';c.textBaseline='middle';c.fillText(v[0],75,yy+26);c.fillStyle='#102131';c.font=v[0]==='SERIAL NUMBER'?'800 28px Arial':'650 25px Arial';c.fillText(v[1],440,yy+26)})}$('create').onclick=async()=>{if(!img?.naturalWidth)return;$('create').disabled=true;try{let c=$('canvas'),x=c.getContext('2d'),W=1600,H=1400,ph=700,panel=730;c.width=W;c.height=H;x.fillStyle='#fff';x.fillRect(0,0,W,H);x.save();x.beginPath();x.rect(35,35,1530,660);x.clip();cover(x,img,35,35,1530,660);x.restore();x.fillStyle='#071a2b';x.fillRect(0,695,W,35);x.fillRect(0,panel,W,H-panel);let g=await logo(),s=Math.min(360/g.naturalWidth,105/g.naturalHeight);x.drawImage(g,55,panel+28,g.naturalWidth*s,g.naturalHeight*s);let p=$('type').value==='pass';x.fillStyle='#fff';x.textAlign='right';x.font='800 36px Arial';x.fillText(p?'PASSIVATION RECORD':'ASSET IDENTIFICATION',1545,panel+65);x.font='500 22px Arial';x.fillStyle='#bfcbd5';x.fillText(p?'PROCESS RECORD / SITE DOCUMENTATION':'EQUIPMENT / ASSET REGISTER',1545,panel+103);let r=p?[["SYSTEM",$('system').value||'—'],["LOCATION",$('plocation').value||'—'],["DATE",$('date').value||'—'],["START TIME",$('start').value||'—'],["FINISH TIME",$('finish').value||'—'],["DURATION",dur().replace('PASSIVATION DURATION: ','')],["CHEMICAL",$('chemical').value||'—'],["AMOUNT OF CHEMICAL",$('amount').value||'—'],["FINAL CONDUCTIVITY",($('conductivity').value||'—')+' µS/cm']]:[["LOCATION",$('location').value||'—'],["MODEL",$('model').value||'—'],["SERIAL NUMBER",$('serial').value||'—'],["ENGINEERING NUMBER",$('engineering').value||'—'],["SIZE",$('size').value||'—']];rows(x,r,855);x.fillStyle='#145d8a';x.fillRect(0,1370,W,30);let d=c.toDataURL('image/jpeg',.93);$('result').src=d;$('download').href=d;$('outputCard').style.display='block';$('status').textContent='Label created — 1600 × 1400 px.';$('outputCard').scrollIntoView({behavior:'smooth'})}catch(e){console.error(e);$('status').textContent='Could not create label. Check cid-logo.jpeg is in GitHub.'}$('create').disabled=false}</script></body></html>
